name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # If your project is in a subfolder, uncomment and set it:
    # defaults:
    #   run:
    #     working-directory: brave-beta-portable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Fetch dependencies
        run: go mod tidy

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/brave-beta-portable.exe .
          go build -trimpath -o dist/brave-beta-portable-debug.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brave-beta-portable
          path: dist/*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.exe --generate-notes